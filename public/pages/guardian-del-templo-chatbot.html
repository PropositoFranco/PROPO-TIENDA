<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guía de la Propotienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://player.vimeo.com">
<link rel="preconnect" href="https://i.vimeocdn.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg-base:#0a0e17;
    --panel:#141a2b;
    --panel-2:#1b2338;
    --bot-bubble:#161d30;
    --user-bubble-1:#f6c343;
    --user-bubble-2:#e8962e;
    --gold:#f2c94c;
    --text:#eef1f7;
    --text-dim:#8b93a7;
    --line:rgba(242,201,76,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100%;
    font-family:'Inter', sans-serif;
    color:var(--text);
    background:var(--bg-base);
    position:relative;
    display:flex;
    justify-content:center;
    padding:32px 14px 20px;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-1;
    background:var(--bg-base);
  }

  /* ---- Esferas de luz de fondo ----
     4 esferas de colores vivos y muy visibles (naranja, amarillo, cian, morado).
     Cada una se mueve en unidades relativas a la pantalla (vw/vh), no a su
     propio tamaño, para que el recorrido sea predecible y SIEMPRE quede
     dentro de lo visible, cruzando por encima/alrededor de la pestaña del
     chat en vez de escaparse hacia las esquinas. Menos desenfoque y más
     opacidad que antes, para que se noten fuerte, como en la referencia. */
  .esfera{
    position:fixed; top:50%; left:50%;
    border-radius:50%; pointer-events:none; z-index:-1;
    filter: blur(95px);
    mix-blend-mode: screen;
    opacity:0.95;
    will-change: transform;
  }
  .esfera.naranja{
    width:780px; height:780px;
    background: radial-gradient(circle, #FA9238 0%, rgba(250,146,56,0) 72%);
    animation: moverNaranja 34s ease-in-out infinite;
  }
  .esfera.amarillo{
    width:680px; height:680px;
    background: radial-gradient(circle, #F7BD21 0%, rgba(247,189,33,0) 72%);
    animation: moverAmarillo 47s ease-in-out infinite;
    animation-delay: -9s;
  }
  .esfera.cian{
    width:820px; height:820px;
    background: radial-gradient(circle, #5FDCFD 0%, rgba(95,220,253,0) 72%);
    animation: moverCian 41s ease-in-out infinite;
    animation-delay: -21s;
  }
  .esfera.morado{
    width:720px; height:720px;
    background: radial-gradient(circle, #6141D5 0%, rgba(97,65,213,0) 72%);
    animation: moverMorado 26s ease-in-out infinite;
    animation-delay: -4s;
  }

  @keyframes moverNaranja{
    0%,100%{ transform: translate(calc(-50% - 22vw), calc(-50% - 18vh)) scale(1); }
    18%{ transform: translate(calc(-50% - 32vw), calc(-50% - 6vh)) scale(1.15); }
    36%{ transform: translate(calc(-50% - 12vw), calc(-50% - 26vh)) scale(0.85); }
    54%{ transform: translate(calc(-50% - 28vw), calc(-50% - 12vh)) scale(1.08); }
    72%{ transform: translate(calc(-50% - 8vw), calc(-50% - 28vh)) scale(0.92); }
    88%{ transform: translate(calc(-50% - 20vw), calc(-50% - 16vh)) scale(1.05); }
  }
  @keyframes moverAmarillo{
    0%,100%{ transform: translate(calc(-50% - 24vw), calc(-50% + 16vh)) scale(1); }
    20%{ transform: translate(calc(-50% - 14vw), calc(-50% + 24vh)) scale(1.14); }
    42%{ transform: translate(calc(-50% - 30vw), calc(-50% + 6vh)) scale(0.86); }
    60%{ transform: translate(calc(-50% - 10vw), calc(-50% + 20vh)) scale(1.1); }
    80%{ transform: translate(calc(-50% - 22vw), calc(-50% + 12vh)) scale(0.94); }
  }
  @keyframes moverCian{
    0%,100%{ transform: translate(calc(-50% + 24vw), calc(-50% - 10vh)) scale(1); }
    16%{ transform: translate(calc(-50% + 34vw), calc(-50% - 20vh)) scale(1.16); }
    34%{ transform: translate(calc(-50% + 14vw), calc(-50% + 8vh)) scale(0.86); }
    52%{ transform: translate(calc(-50% + 30vw), calc(-50% - 4vh)) scale(1.1); }
    70%{ transform: translate(calc(-50% + 18vw), calc(-50% - 18vh)) scale(0.9); }
    86%{ transform: translate(calc(-50% + 26vw), calc(-50% + 2vh)) scale(1.04); }
  }
  @keyframes moverMorado{
    0%,100%{ transform: translate(calc(-50% - 6vw), calc(-50% - 6vh)) scale(1); }
    22%{ transform: translate(calc(-50% + 8vw), calc(-50% + 5vh)) scale(1.15); }
    44%{ transform: translate(calc(-50% - 10vw), calc(-50% + 8vh)) scale(0.88); }
    66%{ transform: translate(calc(-50% + 6vw), calc(-50% - 9vh)) scale(1.1); }
    85%{ transform: translate(calc(-50% - 4vw), calc(-50% + 2vh)) scale(0.95); }
  }
  .shell{width:100%; max-width:676px;}

  .encabezado{ text-align:center; position:relative; margin-bottom:22px; }
  .titulo{
    font-family:'Poppins', sans-serif;
    font-weight:800;
    font-size:34px;
    color:#fff;
    letter-spacing:-0.01em;
    margin:0;
    position:relative;
    display:inline-block;
  }
  .titulo .subrayado{
    position:absolute; left:6%; right:6%; top:-10px; height:2px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  }
  .chispa{
    position:absolute; font-size:16px; color:var(--gold);
    filter:drop-shadow(0 0 6px rgba(242,201,76,0.7));
    animation: destello 2.6s ease-in-out infinite;
  }
  .chispa.c1{ top:-14px; left:14%; animation-delay:.2s; }
  .chispa.c2{ top:6px; right:12%; font-size:12px; animation-delay:1s; }
  .chispa.c3{ bottom:-8px; right:26%; font-size:10px; animation-delay:1.6s; }
  @keyframes destello{ 0%,100%{ opacity:.35; transform:scale(0.85);} 50%{ opacity:1; transform:scale(1.05);} }

  .ventana{
    border-radius:16px;
    background:var(--panel);
    border:1px solid rgba(255,255,255,0.06);
    overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    margin-bottom:16px;
  }
  .barra-ventana{
    display:flex; align-items:center; justify-content:center; position:relative;
    padding:10px 14px; background:var(--panel-2);
    border-bottom:1px solid rgba(255,255,255,0.05);
  }
  .puntos{ position:absolute; left:14px; display:flex; gap:6px; }
  .puntos span{ width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.18); }
  .barra-ventana .etiqueta{
    font-size:11px; letter-spacing:0.10em; text-transform:uppercase;
    color:var(--text-dim); font-weight:600;
  }

  .video-loop{
    position:relative; height:230px;
    background:
      radial-gradient(circle at 30% 20%, rgba(47,214,217,0.25), transparent 55%),
      radial-gradient(circle at 75% 75%, rgba(242,201,76,0.18), transparent 50%),
      #0e1424;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .video-loop iframe{
    position:absolute; top:50%; left:50%;
    width:100%; height:100%;
    min-width:100%; min-height:100%;
    /* Sobre-escalamos el iframe para que cubra el recuadro tipo "video de fondo",
       igual que object-fit:cover en un <video> */
    transform:translate(-50%,-50%) scale(1.6);
    border:0; pointer-events:none; z-index:0;
    opacity:0;
    animation: apareceVideoGuardian .7s ease-out forwards;
    animation-delay: 1.3s;
  }
  @keyframes apareceVideoGuardian{ from{ opacity:0; } to{ opacity:1; } }
  .video-loop::before, .video-loop::after{
    content:""; position:absolute; width:220px; height:220px; border-radius:50%;
    border:1px solid rgba(242,201,76,0.25); animation: girar 12s linear infinite;
  }
  .video-loop::after{ width:150px; height:150px; border-color:rgba(47,214,217,0.35); animation-duration:8s; animation-direction:reverse; }
  @keyframes girar{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }
  .sello-guardian{
    width:70px; height:70px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:30px;
    background:radial-gradient(circle at 35% 30%, rgba(242,201,76,0.9), rgba(47,214,217,0.35) 75%);
    box-shadow:0 0 24px rgba(242,201,76,0.4);
    animation: respirar 3.6s ease-in-out infinite; z-index:1;
  }
  @keyframes respirar{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.06);} }

  /* ---- Portal de acceso (captura de nombre) ---- */
  .portal-acceso{
    padding:22px 18px;
    text-align:center;
  }
  .portal-acceso p{
    color:var(--text-dim);
    font-size:15px;
    margin:0 0 14px;
  }
  .fila-nombre{
    display:flex; gap:8px;
  }
  .fila-nombre input{
    flex:1;
    background:var(--panel-2);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:15px;
    padding:12px 14px;
    outline:none;
  }
  .fila-nombre input:focus{ border-color:var(--gold); }
  .fila-nombre button{
    background:linear-gradient(135deg, var(--user-bubble-1), var(--user-bubble-2));
    border:none; color:#26190a; font-weight:700;
    border-radius:12px; padding:0 18px; cursor:pointer;
    font-family:'Inter', sans-serif; font-size:14.5px;
  }

  .oculto{ display:none !important; }

  .preguntas{ display:flex; flex-wrap:wrap; gap:5px; padding:8px 12px 0; justify-content:center; border-top:1px solid rgba(255,255,255,0.05); margin-top:2px; }
  .chip{
    font-family:'Inter', sans-serif; font-size:11px; font-weight:600; color:var(--gold);
    background:rgba(242,201,76,0.08); border:1px solid var(--line); border-radius:999px;
    padding:5px 9px; cursor:pointer; transition:all .18s ease;
  }
  .chip:hover{ background:rgba(242,201,76,0.16); }
  .chip:disabled{ opacity:.4; cursor:not-allowed; }

  .chat{ padding:16px 14px 4px; display:flex; flex-direction:column; gap:12px; max-height:58vh; overflow-y:auto; }
  .chat::-webkit-scrollbar{ width:7px; }
  .chat::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:4px; }

  .msg{ max-width:88%; padding:11px 14px; border-radius:14px; font-size:13.5px; line-height:1.5; }
  .msg.bot{ align-self:flex-start; background:var(--bot-bubble); border:1px solid rgba(255,255,255,0.05); border-top-left-radius:3px; }
  .msg.bot strong{ color:var(--gold); font-weight:700; }
  .msg.bot ul{ margin:6px 0; padding-left:18px; }
  .msg.bot li{ margin-bottom:4px; }
  .msg.user{
    align-self:flex-end;
    background:linear-gradient(135deg, var(--user-bubble-1), var(--user-bubble-2));
    color:#26190a; font-weight:600; border-top-right-radius:3px;
  }
  .msg.error{
    align-self:center; background:rgba(160,40,40,0.16);
    border:1px solid rgba(220,90,90,0.35); color:#f3c8c8; font-size:13px;
    max-width:96%; text-align:left;
  }
  .msg.error .detalle{ display:block; margin-top:6px; font-size:11.5px; color:#e0a5a5; word-break:break-word; }
  .msg.error button{
    margin-top:8px; background:rgba(242,201,76,0.16); border:1px solid var(--line);
    color:var(--gold); border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer;
  }
  .thinking{ align-self:flex-start; display:flex; gap:5px; padding:12px 15px; }
  .thinking span{ width:6px; height:6px; border-radius:50%; background:var(--gold); animation:pulso 1.1s ease-in-out infinite; }
  .thinking span:nth-child(2){ animation-delay:.15s; }
  .thinking span:nth-child(3){ animation-delay:.3s; }
  @keyframes pulso{ 0%,100%{ opacity:.25; transform:translateY(0);} 50%{ opacity:1; transform:translateY(-3px);} }

  .acciones{ display:flex; gap:6px; justify-content:center; padding:6px 12px 0; }
  .accion{
    display:flex; align-items:center; gap:4px; background:var(--panel-2);
    border:1px solid rgba(255,255,255,0.06); color:var(--text-dim);
    font-size:10.5px; font-weight:600; padding:4px 9px; border-radius:8px; cursor:pointer;
  }
  .accion:hover{ color:var(--text); border-color:rgba(255,255,255,0.15); }

  .input-bar{ display:flex; align-items:flex-end; gap:8px; padding:12px 10px 2px; }
  textarea{
    flex:1; resize:none; background:var(--panel-2); border:1px solid rgba(255,255,255,0.08);
    border-radius:24px; color:var(--text); font-family:'Inter', sans-serif; font-size:13px;
    line-height:1.4; padding:13px 20px; max-height:110px; outline:none;
  }
  textarea:focus{ border-color:var(--gold); }
  textarea::placeholder{ color:var(--text-dim); }
  button.enviar{
    width:42px; height:42px; flex:none; border-radius:50%;
    background:linear-gradient(135deg, var(--user-bubble-1), var(--user-bubble-2));
    border:none; color:#26190a; font-size:18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  button.enviar:disabled{ opacity:.4; cursor:not-allowed; }

  /* Contador de caracteres del mensaje — discreto, solo llama la atención
     (color ámbar) cuando la persona ya casi llega al límite. */
  .contador-caracteres{
    text-align:right; font-size:10.5px; color:var(--text-dim);
    padding:0 22px 6px; user-select:none;
  }
  .contador-caracteres.cerca{ color:var(--gold); }
  .contador-caracteres.lleno{ color:#e0685a; }

  .footer-note{ text-align:center; font-size:11.5px; color:var(--text-dim); padding:0 20px 4px; }

  /* ---- Brillo que sigue al cursor sobre los bordes (solo en PC/mouse) ----
     Dos capas por elemento (::before morado, ::after dorado) que se turnan
     cada 3s con un crossfade suave. La posición (--lx/--ly) la actualiza el
     JS de más abajo en cada mousemove, así el brillo va justo donde está
     el cursor sobre ese borde. */
  @media (hover:hover) and (pointer:fine){
    .ventana, .chip, .accion, textarea, button.enviar{ position:relative; }

    .ventana::before, .ventana::after,
    .chip::before, .chip::after,
    .accion::before, .accion::after,
    textarea::before, textarea::after,
    button.enviar::before, button.enviar::after{
      content:"";
      position:absolute; inset:0;
      border-radius:inherit;
      padding:1.5px;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity:0;
      pointer-events:none;
      animation-play-state: paused;
      z-index:3;
    }

    .ventana::before, .chip::before, .accion::before, textarea::before, button.enviar::before{
      background: radial-gradient(160px 160px at var(--lx,50%) var(--ly,50%),
        rgba(201,166,255,0.95), transparent 65%);
      filter: drop-shadow(0 0 6px rgba(201,166,255,0.6));
      animation: cicloBrilloMorado 6s ease-in-out infinite;
    }
    .ventana::after, .chip::after, .accion::after, textarea::after, button.enviar::after{
      background: radial-gradient(160px 160px at var(--lx,50%) var(--ly,50%),
        rgba(242,201,76,0.95), transparent 65%);
      filter: drop-shadow(0 0 6px rgba(242,201,76,0.6));
      animation: cicloBrilloDorado 6s ease-in-out infinite;
      animation-delay: 3s;
    }

    .ventana:hover::before, .chip:hover::before, .accion:hover::before,
    textarea:hover::before, button.enviar:hover::before,
    .ventana:hover::after, .chip:hover::after, .accion:hover::after,
    textarea:hover::after, button.enviar:hover::after{
      animation-play-state: running;
    }
  }
  @keyframes cicloBrilloMorado{
    0%, 100%{ opacity:0; }
    50%{ opacity:1; }
  }
  @keyframes cicloBrilloDorado{
    0%, 100%{ opacity:0; }
    50%{ opacity:1; }
  }
</style>
</head>
<body>

<div class="esfera naranja"></div>
<div class="esfera amarillo"></div>
<div class="esfera cian"></div>
<div class="esfera morado"></div>

<div class="shell">

  <div class="encabezado">
    <span class="chispa c1">✦</span>
    <span class="chispa c2">✧</span>
    <span class="chispa c3">✦</span>
    <h1 class="titulo"><span class="subrayado"></span>Guía de la Propotienda</h1>
  </div>

  <div class="ventana">
    <div class="barra-ventana">
      <div class="puntos"><span></span><span></span><span></span></div>
      <span class="etiqueta">La Cámara del Guardián</span>
    </div>

    <div class="video-loop">
      <iframe
        src="https://player.vimeo.com/video/1218704734?autoplay=1&loop=1&muted=1&background=1&autopause=0&controls=0"
        title="Video del Guardián del Templo"
        allow="autoplay; fullscreen; picture-in-picture"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>

    <div id="contenidoChat">
      <div class="chat" id="chat"></div>

      <div class="acciones">
        <button class="accion" id="btnDescargar">⬇ Descargar plan</button>
        <button class="accion" id="btnNuevaSesion">↻ Nueva sesión</button>
      </div>

      <div class="preguntas" id="preguntas">
        <button class="chip" data-q="¿Qué es el Templo del Propósito y qué transformación real puedo esperar si me comprometo con la plataforma?">¿Qué voy a lograr aquí?</button>
        <button class="chip" data-q="¿Cómo es el proceso cuando entro por primera vez y qué debo hacer para empezar a ver cambios reales?">¿Por dónde empiezo?</button>
        <button class="chip" data-q="¿Cómo funciona la evaluación semanal y los territorios, y cómo me ayuda a saber exactamente en qué enfocar mi esfuerzo cada semana?">¿En qué debo enfocarme?</button>
        <button class="chip" data-q="¿Cómo gano PropoCoins y qué puedo hacer con ellos para acelerar mi propia transformación?">¿Cómo acelero mi cambio?</button>
        <button class="chip" data-q="¿Qué es la Activación Templaria (el sello que doy al terminar mi ejercicio semanal) y qué recompensa me da al completarlo?">¿Cómo veo mi progreso?</button>
        <button class="chip" data-q="¿Cómo funciona el ranking semanal y cómo me ayuda a comprobar que mi constancia sí se está notando?">¿Voy avanzando de verdad?</button>
        <button class="chip" data-q="¿Cómo funcionan las membresías y qué significa realmente comprometerme con este proceso de 6 meses?">¿Qué tan en serio es esto?</button>
        <button class="chip" data-q="¿El Templo del Propósito es una secta, un MLM disfrazado, o algo raro?">¿Es esto un MLM o algo raro?</button>
        <button class="chip" data-q="¿Qué es 100 Templarios Dijeron y cómo me ayuda a seguir avanzando sin que se sienta como tarea?">¿Cómo lo hago divertido?</button>
        <button class="chip" data-q="¿De qué formas puedo invitar a otras personas a la Propotienda, y qué gano yo por hacerlo?">¿Cómo invito a alguien?</button>
        <button class="chip" data-q="No tengo un 'gasto típico' confirmado con datos históricos todavía, pero explícame de forma honesta cuánto podría llegar a costarme todo esto en 6 meses considerando la membresía y lo que es opcional.">¿Cuánto cuesta todo esto realmente?</button>
        <button class="chip" data-q="¿Qué pasa si una semana no completo mi ejercicio o no entro a la plataforma?">¿Qué pasa si no completo mi ejercicio?</button>
      </div>

      <div class="input-bar">
        <textarea id="entrada" rows="1" maxlength="450" placeholder="Escríbele al Guardián..."></textarea>
        <button class="enviar" id="btnEnviar">↑</button>
      </div>
      <div class="contador-caracteres" id="contadorCaracteres">0 / 450</div>
    </div>
  </div>

  <p class="footer-note">El Guardián solo responde con información confirmada del proyecto. Si algo no lo sabe con certeza, te lo dirá en vez de inventarlo.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================================
   BASE DE CONOCIMIENTO — TEMPLO DEL PROPÓSITO / PROPOTIENDA
   -------------------------------------------------------------------------
   Todo lo escrito aquí abajo son datos confirmados por Dany. Donde falta
   información exacta (montos de PropoCoins, catálogo de la tienda, nombres
   de los 8 territorios, mecánica fina de sellos/activaciones, precios
   comerciales), se dejó marcado con [COMPLETAR: ...] a propósito — el
   Guardián tiene instrucción explícita de NO inventar nada ahí. Reemplaza
   esos bloques con la copy real antes de publicar el bot en producción.

   INTEGRACIÓN FUTURA: cuando conectes esto a Supabase/React, el bloque
   PERFIL_USUARIO de más abajo debe llenarse con los datos reales de la
   sesión activa (nombre, membership_type, territorio más débil actual
   según su última evaluación, saldo de PropoCoins, racha, etc.) para que
   cada respuesta hable directamente de la situación real de esa persona,
   no de forma genérica.
   ========================================================================= */
/* NOTA: este texto ya NO se manda a la IA desde el navegador (por seguridad,
   nada de prompts/API se llama directo desde aquí). Se deja como material de
   referencia: la Edge Function guardian-api tiene su propio system prompt,
   más corto, con las reglas de tono/privacidad/dinero. Si quieres que el
   Guardián conozca TODO este detalle (territorios, catálogo, niveles, etc.),
   ese texto hay que pegarlo en el código de la Edge Function, no aquí. */
const BASE_DE_CONOCIMIENTO = `
Eres "El Guardián", el asistente conversacional oficial de Templo del
Propósito (también conocido como Propotienda, propotienda.com), una
plataforma gamificada de desarrollo personal.

TU FORMA DE HABLAR:
- Español, como el amigo que de verdad quiere verte lograrlo — no un
  manual, no una FAQ, no un bot genérico. Alguien que te escucha, te
  orienta con claridad y te dice exactamente qué sigue, para cuándo y por
  qué — y que se nota que le emociona verte avanzar.
- Contagia entusiasmo real en cada respuesta. La persona debe sentir que
  se está acercando a algo grande y que vale la pena, no que está leyendo
  instrucciones. Esto aplica a TODA respuesta, hasta la más operativa —
  el ánimo no es un extra, es cómo hablas siempre.
- Habla siempre directamente a la persona por su nombre cuando lo sepas,
  de forma natural (no lo repitas en cada frase, solo cuando aporte calidez
  o refuerce que le estás hablando a ella/él específicamente).
- Respuestas breves, claras y concisas. Nunca respuestas larguísimas.
- Usa "tú", cercano pero respetuoso.
- Varía tu lenguaje de respuesta en respuesta. No repitas las mismas
  palabras o la misma frase de apertura como fórmula fija (evita caer en
  muletillas tipo usar "increíble" o "transformación" en cada mensaje) —
  transmite esa emoción con palabras distintas cada vez, como lo haría
  una persona real, no un guion.
- Formatea tus respuestas con **negritas** para los conceptos clave y con
  líneas que empiecen en "- " cuando enumeres pasos u opciones.
- Si el usuario hace una pregunta que no tiene que ver con la Propotienda,
  redirige amablemente la conversación.

REGLA DE ORO — SIEMPRE TRANSFORMADOR, NUNCA SOLO TÉCNICO:
Lo que más le importa a la persona NO es cómo funciona el sistema por
dentro, es qué va a cambiar en su vida si hace lo que le estás explicando.
Por eso, en TODA respuesta:
- Primero y con más peso: dile con claridad y con ganas qué va a vivir,
  qué va a lograr, en qué se va a convertir o qué va a poder hacer que hoy
  no puede, SI hace lo que está preguntando/lo que le tocó. Ese es el
  corazón de la respuesta, no un cierre opcional — y así es como suenas
  siempre, no solo cuando "toca motivar".
- El funcionamiento técnico (cómo se activa, cuántos clics, mecánica
  exacta) va después, breve, como apoyo — nunca como protagonista. Está
  bien mencionarlo, pero no es lo que emociona a la persona.
- Sé ESPECÍFICO y CONCRETO sobre el cambio, nunca vago ni abstracto. Evita
  frases genéricas de autoayuda tipo "vas a crecer mucho" o "vas a mejorar
  tu vida" sin más — en vez de eso, dile exactamente qué se mueve: qué
  territorio se fortalece, con qué acción concreta, y qué evidencia va a
  poder ver de ese cambio (su propia evaluación semana con semana, su
  ranking, sus PropoCoins, su racha, etc. — usa lo que ya sabes del sistema).
- La idea es que la persona NO tenga que imaginarse ni interpretar por su
  cuenta cuál es el beneficio — que le quede clarísimo, sin ambigüedad,
  para que se emocione con algo real y no con una idea vaga que ella misma
  se inventó.
- Esto aplica a CUALQUIER pregunta, hasta las que suenan puramente
  operativas ("¿cómo canjeo mis PropoCoins?", "¿cómo funciona el ranking?").
  Nunca respondas solo el "cómo": siempre amarra el "cómo" con el "para
  qué te sirve realmente a ti".
- Nunca inventes resultados, cifras o promesas que no estén respaldadas
  por esta base de conocimiento (ver regla de abajo). Transformador no
  significa exagerar ni prometer de más — significa dejar clarísimo,
  con lo que sí es cierto, el cambio real que este sistema está diseñado
  para producir.

REGLA MÁS IMPORTANTE — NUNCA INVENTES, Y SIEMPRE REDIRIGE HACIA ALGO QUE SÍ SABES:

=== QUÉ ES EL TEMPLO DEL PROPÓSITO ===
Una plataforma gamificada de desarrollo personal (dominio propotienda.com),
con estética RPG en dorado y morado. Combina niveles de membresía, un
sistema de evaluación y ejercicios semanales personalizados, un sistema de
sorteos, un juego de trivia semanal, un sistema de referidos/alianzas y
una comunidad interna con ranking.

=== TU PRIMER RECORRIDO AL ENTRAR (ONBOARDING) ===
1. Al entrar por primera vez, el usuario pasa primero por un **tutorial**
   que lo orienta en la plataforma.
2. Justo después de completar el tutorial, la plataforma lo manda
   directo a contestar su **evaluación semanal**.
3. Esa evaluación mide su punto actual respecto a **8 territorios** de
   desarrollo personal [COMPLETAR: nombres exactos de los 8 territorios].
4. Con base en las respuestas, el sistema identifica cuál territorio está
   actualmente más débil — ese es el que se prioriza esa semana.
5. Automáticamente, el sistema le entrega al usuario el **ejercicio
   correspondiente** a ese territorio débil, para trabajarlo durante esa
   semana.
6. Este ciclo se repite **cada semana durante 6 meses**: el usuario
   contesta su evaluación, y semana con semana recibe un ejercicio
   personalizado según el territorio que su evaluación más reciente marcó
   como prioritario.

TRANSFORMACIÓN DE ESTE SISTEMA (úsala al explicarlo): la persona deja de
adivinar en qué enfocarse — el sistema le señala, con su propia evaluación,
exactamente cuál es su punto más débil AHORA, y le da la acción concreta
de esa semana para moverlo. No es trabajo disperso ni motivación genérica:
es una dirección clara, semana tras semana, durante 6 meses. Al final de
ese proceso, la persona puede comparar su evaluación de hoy contra la de
hace 6 meses y ver, territorio por territorio, en qué estaba y en qué está
— el cambio queda documentado, no es solo una sensación.

/* Devuelve el JWT de la sesión activa de Supabase Auth, o null si no hay
   sesión (usuario no logueado / sesión aún no llegó). */
async function obtenerAccessToken(){
  if(!supabaseClient) return null;
  try{
    const { data, error } = await supabaseClient.auth.getSession();
    if(error || !data?.session?.access_token) return null;
    return data.session.access_token;
  } catch(e){
    console.warn('No se pudo leer la sesión de Supabase:', e);
    return null;
  }
}

function agregarMensaje(texto, tipo){
  const div = document.createElement('div');
  div.className = 'msg ' + tipo;
  if(tipo === 'bot'){
    div.innerHTML = formatear(texto);
  } else {
    div.textContent = texto;
  }
  chat.appendChild(div);
  if(tipo === 'bot'){
    // Al llegar la respuesta, dejamos visible la PREGUNTA del usuario en la
    // parte de arriba (no la respuesta) — así la persona ve qué preguntó y
    // desde ahí puede ir bajando para leer la respuesta completa.
    const mensajes = chat.querySelectorAll('.msg.user');
    const ultimaPregunta = mensajes[mensajes.length - 1];
    (ultimaPregunta || div).scrollIntoView({ behavior:'smooth', block:'start' });
  } else {
    chat.scrollTop = chat.scrollHeight;
  }
  return div;
}

function agregarMensajeError(detalleTecnico){
  const div = document.createElement('div');
  div.className = 'msg error';

    '<br><button id="btnReintentar">Reintentar</button>';

  });
}

function escaparHTML(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatear(texto){
  const escapado = escaparHTML(texto);
  const lineas = escapado.split('\n');
  let html = '';
  let dentroLista = false;

  lineas.forEach(linea => {
    const esBullet = linea.trim().startsWith('- ');
    if(esBullet && !dentroLista){ html += '<ul>'; dentroLista = true; }
    if(!esBullet && dentroLista){ html += '</ul>'; dentroLista = false; }

    if(esBullet){
      html += '<li>' + linea.trim().slice(2) + '</li>';
    } else if(linea.trim() === ''){
      html += '<br>';
    } else {
      html += linea + '<br>';
    }
  });
  if(dentroLista) html += '</ul>';

  return html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

      return;
    }

    // El backend (guardian-api) ya conoce quién eres por el JWT: jala tu
    // perfil real y arma el system prompt del lado del servidor. Desde
    // aquí solo mandamos el mensaje y el historial reciente de la charla.
    const cuerpo = {
      modo: 'chat',
      mensaje: historial[historial.length - 1]?.content || '',
      historial: historial.slice(0, -1).slice(-10)
    };

    const response = await fetch(GUARDIAN_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token,
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify(cuerpo)
    });

    const crudo = await response.text();

    let data;
    try{
      data = JSON.parse(crudo);
    } catch(errorParseo){
      throw new Error('Respuesta no era JSON válido: ' + crudo.slice(0, 200));
    }

    if(!response.ok || !data.ok){
      throw new Error(data?.error || ('HTTP ' + response.status));
    }

    const textoResp = (data.respuesta || '').trim();

    quitarPensando();
    ultimaPreguntaFallida = null;

    if(!textoResp){
      agregarMensajeError('La respuesta llegó vacía.');
    } else {
      agregarMensaje(textoResp, 'bot');
      historial.push({role:'assistant', content: textoResp});
      // El guardado del intercambio en guardian_conversaciones ya lo hace
      // guardian-api del lado del servidor — no hay que insertarlo aquí.
      generarPreguntasDeSeguimiento();
    }
  } catch(err){
    console.error('Error al consultar al Guardián:', err);
    quitarPensando();
    ultimaPreguntaFallida = true;
    agregarMensajeError((err && err.name ? err.name + ': ' : '') + (err && err.message ? err.message : String(err)));
  } finally {
    bloquearEntrada(false);
    entrada.focus();
  }
}

function bloquearEntrada(bloqueada){
  entrada.disabled = bloqueada;
  btnEnviar.disabled = bloqueada;
  preguntasBox.querySelectorAll('.chip').forEach(c => c.disabled = bloqueada);
}

btnEnviar.addEventListener('click', () => enviarPregunta(entrada.value));
entrada.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    enviarPregunta(entrada.value);
  }
});
entrada.addEventListener('input', () => {
  entrada.style.height = 'auto';
  entrada.style.height = Math.min(entrada.scrollHeight, 110) + 'px';
  actualizarContador();
});

const LIMITE_CARACTERES = 450;
const contadorEl = document.getElementById('contadorCaracteres');
function actualizarContador(){
  const largo = entrada.value.length;
  contadorEl.textContent = largo + ' / ' + LIMITE_CARACTERES;
  contadorEl.classList.toggle('cerca', largo >= LIMITE_CARACTERES * 0.85 && largo < LIMITE_CARACTERES);
  contadorEl.classList.toggle('lleno', largo >= LIMITE_CARACTERES);
}

preguntasBox.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(chip && !chip.disabled){
    // Al elegir una pregunta predefinida, la escribimos completa en la barra
    // de texto para que la persona la vea entera antes de decidir enviarla
    // — no se manda sola con el clic.
    entrada.value = chip.dataset.q;
    entrada.style.height = 'auto';
    entrada.style.height = Math.min(entrada.scrollHeight, 110) + 'px';
    actualizarContador();
    entrada.focus();
  }
});

/* ---- Brillo de borde que sigue al cursor (solo PC con mouse) ----
   Recalcula --lx/--ly (posición del brillo dentro de cada elemento) en
   cada movimiento del mouse. Se consulta el DOM en cada evento porque los
   chips de preguntas se regeneran dinámicamente (renderPreguntas). */
if(window.matchMedia('(hover:hover) and (pointer:fine)').matches){
  const SELECTOR_BRILLO = '.ventana, .chip, .accion, textarea, button.enviar';
  document.addEventListener('mousemove', (e) => {
    document.querySelectorAll(SELECTOR_BRILLO).forEach(el => {
      const r = el.getBoundingClientRect();
      el.style.setProperty('--lx', (e.clientX - r.left) + 'px');
      el.style.setProperty('--ly', (e.clientY - r.top) + 'px');
    });
  }, { passive:true });
}

function renderPreguntas(lista){
  preguntasBox.innerHTML = '';
  lista.forEach(texto => {
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.dataset.q = texto;
    btn.textContent = texto.length > 42 ? texto.slice(0, 40).trim() + '…' : texto;
    preguntasBox.appendChild(btn);
  });
}

/* Le pide al Guardián (una llamada corta y aparte) 3 preguntas de
   seguimiento coherentes con lo que se acaba de conversar, y las muestra
   como chips nuevos arriba de la caja de texto. Si algo falla, deja las
   preguntas que ya estaban puestas — nunca deja al usuario sin opciones. */
async function generarPreguntasDeSeguimiento(){
  try{
    const token = await obtenerAccessToken();
    if(!token) return; // sin sesión, se quedan los chips que ya estaban puestos

    const response = await fetch(GUARDIAN_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token,
        "apikey": SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ modo: 'seguimiento', historial: historial.slice(-6) })
    });
    if(!response.ok) return;
    const data = await response.json();
    if(!data.ok || !Array.isArray(data.preguntas) || !data.preguntas.length) return;
    renderPreguntas(data.preguntas.slice(0, 3));
  } catch(e){
    console.warn('No se pudieron generar preguntas de seguimiento, se dejan las anteriores:', e);
  }
}

btnNuevaSesion.addEventListener('click', () => {
  historial = [];
  chat.innerHTML = '';
  mostrarBienvenida();
});

btnDescargar.addEventListener('click', () => {
  const contenido = historial.map(m =>
    ((m.role === 'user' ? (nombreUsuario || 'Tú') : 'El Guardián') + ': ' + m.content)
  ).join('\n\n');
  const blob = new Blob([contenido || 'Aún no hay conversación con el Guardián.'], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'plan-templo-del-proposito.txt';
  a.click();
  URL.revokeObjectURL(url);
});

/* Heurística simple para elegir "Bienvenido"/"Bienvenida" según el nombre.
   No es infalible: se basa en si el nombre termina en "a" (con algunas
   excepciones comunes de apodos). Si no hay nombre, usa "Bienvenido". */
function saludoSegunNombre(nombre){
  if(!nombre) return 'Bienvenido';
  const limpio = nombre.trim().toLowerCase();
  const apodosFemeninos = ['dani','sofi','vale','male','ale'];
  if(apodosFemeninos.includes(limpio)) return 'Bienvenida';
  return limpio.endsWith('a') ? 'Bienvenida' : 'Bienvenido';
}

function mostrarBienvenida(){
  const saludo = saludoSegunNombre(nombreUsuario);
  agregarMensaje(
    (nombreUsuario
      ? '¡' + saludo + ' a la Propotienda, **' + nombreUsuario + '**! 🔥'
      : '¡' + saludo + ' a la Propotienda! 🔥') +
    ' Estás a un clic de descubrir todo lo que puedes lograr aquí dentro: tu evaluación semanal, ' +
    'tus territorios, tus PropoCoins, las membresías y los sorteos — todo armado para que ' +
    'tu cambio se note de verdad, semana tras semana, sin que tengas que adivinar por dónde empezar. ' +
    'Elige una de las preguntas de abajo o cuéntame qué quieres saber, y arrancamos.',
    'bot'
  );
}

/* Arranque: el chat se muestra de inmediato, con saludo y preguntas ya
   puestas. Si window.GUARDIAN_PERFIL viene inyectado de forma síncrona
   (lo normal si React lo define antes de este script), el saludo ya sale
   personalizado desde el primer render. Si el nombre llega después
   (?codigo= o postMessage), no se reescribe el saludo — solo queda listo
   el contexto para las respuestas que sigan. */
if(window.GUARDIAN_PERFIL) entrarConPerfil(window.GUARDIAN_PERFIL);
mostrarBienvenida();
entrada.focus();
cargarPerfilEnSegundoPlano();

</script>
